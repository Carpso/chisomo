name = "kingdom-sponsor-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

# Sweep accumulated donation platform fees to SETTLEMENT_PHONE daily at 08:00 CAT
# (Zambia / Central Africa Time = UTC+2), plus intruder-alert scan every 15 min,
# plus hourly event-reminder checks (48h/2h countdown pushes to ticket holders).
[triggers]
crons = ["*/15 * * * *", "0 6 * * *", "0 * * * *"]

# DB. For remote deploy, replace database_id with the one from:
#   npx wrangler d1 create kingdom-sponsor-db
[[d1_databases]]
binding = "DB"
database_name = "kingdom-sponsor-db"
database_id = "01c99f57-3f1b-4212-85db-261f86f90a24"

# Campaign branding media (logos). Public images are served via /media/:key.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kingdom-sponsor-media"

# SMS provider: Africa's Talking (OTP + donor/host notifications).
# Set AT_API_KEY (secret) + AT_USERNAME/AT_FROM vars, then `ENV=production` to send real SMS.
# Secrets (set with `npx wrangler secret put NAME`):
#   AT_API_KEY        - Africa's Talking API key (secret - never commit)
#   JWT_SECRET        - random string for signing user tokens
#   LIPILA_API_KEY    - Lipila live/secret key (lsk_/lpk_)
#   LIPILA_WEBHOOK_SECRET - shared secret sent by Lipila callbacks (verify in webhook handler)
#   SUPERADMIN_PHONES - comma-separated superadmin phone numbers (international format)
#   SETTLEMENT_PHONE  - number where Kingdom Sponsor's fee earnings are disbursed
#   FIREBASE_CLIENT_EMAIL - Firebase service-account client email (FCM push)
#   FIREBASE_PRIVATE_KEY  - Firebase service-account private key (FCM push)
#
# Vars (plain config, change freely). NOTE: in production, `wrangler secret put`
# with the same name overrides a var - so these placeholders are dev-only defaults.
[vars]
ENV = "production"              # SMS + OTP mode: "sandbox" shows debug code in API, "production" sends real AT SMS
AT_USERNAME = "ChurchOnApp"     # Africa's Talking app username (not user-facing; used in the AT API call)
AT_FROM = "KSPONSOR"      # approved AT sender ID — used for ALL SMS (OTP + notifications)
AIRTIME_PROVIDER = "manual"     # airtime supplier: mtn_momo (Zambia route) | africastalking | manual (default = admin fulfils by hand)
MTN_MOMO_TARGET_ENV = "sandbox" # MTN MoMo target environment: sandbox | mtnzambia | mtn_za ... (see MTN docs)
# MTN_MOMO_BASE_URL = "https://sandbox.momodeveloper.mtn.com"
LIPILA_ENV = "production"       # Lipila gateway: "sandbox" (api.lipila.dev) or "production" (api.lipila.io, real money)
APP_URL = "https://kingdom-sponsor-api.godfreymoseskalambo.workers.dev"
# CORS_ORIGINS - extra HTTPS origins allowed to call the API from a browser
# (comma-separated, e.g. "https://kingdom-sponsor.app"). APP_URL is always
# allowed. Mobile Flutter clients are not CORS-restricted.
CORS_ORIGINS = ""
# SHORT_BASE_URL - optional custom domain for short share links (e.g.
# "https://share.kingdom-sponsor.app"). Leave unset to reuse APP_URL
# (the workers.dev URL). Switching domains = change this var + deploy; every
# link generated afterwards uses the new domain (existing stored links keep
# working because /go/:code also resolves links created under the previous base).
# To use your own branded domain (e.g. kingdom-sponsor.app), first buy the domain
# and point it at the worker, then set:
#   SHORT_BASE_URL = "https://share.kingdom-sponsor.app"
# SHORT_BASE_URL = "https://share.kingdom-sponsor.app"
PLATFORM_FEE_PCT = "1"          # your cut per donation (%), Kingdom Sponsor keeps 1% above the minimum
PLATFORM_MIN_FEE_CENTS = "300"  # flat minimum platform fee per donation (K3)
LIPILA_COLLECTION_FEE_PCT = "2.5" # Lipila MoMo collection fee (%) -> customer pays 3.5% total on MoMo
LIPILA_DISBURSEMENT_FEE_PCT = "1.5" # Lipila MoMo disbursement fee (%), deducted at payout
CARD_PLATFORM_FEE_PCT = "2"        # card platform fee (%) -> 2% + ZMW 0.24 per card donation
CARD_PLATFORM_MIN_FEE_CENTS = "500" # card platform minimum fee (K5)
CARD_LIPILA_COLLECTION_FEE_PCT = "2.5" # Lipila card collection fee (%), donor pays
OTP_TTL_MINUTES = "5"
PROMO_PRICE_CENTS = "15000"     # cost of a promoted (top-5) slot per purchase: K150
PROMO_DAYS = "7"                # how long a promotion stays live
# Secrets that must NEVER be committed live in .dev.vars for local dev and as production
# secrets via `wrangler secret put` / `wrangler secret bulk`. They are intentionally NOT vars
# here: a var with the same name blocks setting the secret, and secrets must never be committed.
